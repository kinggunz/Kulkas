name: Build Gunzdev
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build template (shell)
        run: gradle :shell:assembleRelease --no-daemon
      - name: Embed template ke Gunzdev
        run: |
          mkdir -p app/src/main/assets
          cp shell/build/outputs/apk/release/shell-release-unsigned.apk app/src/main/assets/template.apk
      - name: Build Gunzdev
        run: gradle :app:assembleDebug --no-daemon
      - name: Cek kompatibilitas Android 8-15
        run: |
          AAPT2="$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)aapt2"
          for f in app/build/outputs/apk/debug/app-debug.apk app/src/main/assets/template.apk; do
            echo "== $f"; "$AAPT2" dump badging "$f" | grep -E "^(sdkVersion|targetSdkVersion)"
          done
          # Gunzdev: minSdk 26 (Android 8) .. targetSdk 34 (jalan di Android 15)
          "$AAPT2" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "^sdkVersion:'26'"
          "$AAPT2" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "^targetSdkVersion:'34'"
          # APK hasil buatan Gunzdev (template): minSdk 21, jadi aman di Android 8-15
          "$AAPT2" dump badging app/src/main/assets/template.apk | grep -q "^sdkVersion:'21'"
      - uses: actions/upload-artifact@v4
        with:
          name: Gunzdev
          path: app/build/outputs/apk/debug/app-debug.apk
